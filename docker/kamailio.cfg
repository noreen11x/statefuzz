#!KAMAILIO
#
# StateFuzz demo target: a real Kamailio SIP server.
#
# Role: registrar (REGISTER) + proxy (INVITE, ACK, BYE, ...) for the domain
# "statefuzz.local", with digest authentication for two users:
#     alice / alice-secret      (the fuzzer)
#     bob   / bob-secret        (the test phone in the "bob" container)
#
# Two modes, chosen when Kamailio starts (python switch_mode.py normal|buggy):
#
#   normal  - secure configuration: credentials are verified, and a user may
#             only register or call as themselves.
#   buggy   - started with "-A WITH_AUTH_BUG -A WITH_STATE_BUG". Two realistic
#             misconfigurations:
#               WITH_AUTH_BUG  the script only checks that credentials are
#                              PRESENT and never verifies them (passwords).
#               WITH_STATE_BUG a BYE for a call that never existed is answered
#                              200 OK (message order / state).
#             Nothing crashes, so a crash-only fuzzer would say "fine"; the
#             StateFuzz rule checker reports VIOLATION.
#
# This is not a planted bug inside Kamailio: it is the kind of routing-script
# mistake that real SIP servers ship with.

####### Global parameters #########

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
children=2

# Fixed address of this container (see docker-compose.yml).
listen=udp:172.28.0.10:5060
alias="statefuzz.local"

####### Modules #########

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"

modparam("usrloc", "db_mode", 0)
modparam("registrar", "min_expires", 5)
modparam("registrar", "max_expires", 3600)

####### Routing logic #########

request_route {
	# Answer to the address the packet really came from (Docker port
	# forwarding changes it), not the one written in the Via header.
	force_rport();

	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}

	if (!sanity_check()) {
		xlog("L_WARN", "malformed request from $si:$sp dropped\n");
		exit;
	}

	xlog("L_INFO", "$rm from $fu to $ru (src $si:$sp)\n");

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	# Requests inside an existing dialog (ACK, BYE after a call is set up).
	if (has_totag()) {
		route(WITHINDLG);
		exit;
	}

	t_check_trans();
	remove_hf("Route");

	if (is_method("INVITE|SUBSCRIBE")) {
		record_route();
	}

	if (is_method("REGISTER")) {
		route(REGISTRAR);
		exit;
	}

	route(AUTH);

	if ($rU == $null) {
		sl_send_reply("484", "Address Incomplete");
		exit;
	}

	if (!lookup("location")) {
		sl_send_reply("404", "Not Found");
		exit;
	}

	route(RELAY);
}

route[RELAY] {
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

route[WITHINDLG] {
	if (loose_route()) {
		route(RELAY);
		exit;
	}
	if (is_method("ACK")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}
#!ifdef WITH_STATE_BUG
	# MISCONFIGURATION (message order / state): a BYE that carries a To tag
	# but matches no call we record-routed is "accepted" anyway. A real BYE
	# always has our Route header, so loose_route() above already handled it.
	# Only a BYE for a call that never existed reaches this line.
	if (is_method("BYE")) {
		xlog("L_WARN", "BUGGY MODE: BYE for unknown call $ci accepted with 200\n");
		sl_send_reply("200", "OK");
		exit;
	}
#!endif
	# No such call: RFC 3261 says 481 Call/Transaction Does Not Exist.
	sl_send_reply("481", "Call/Transaction Does Not Exist");
	exit;
}

# The password of the user named in the credentials ($au); "" if unknown.
route[PASSWD] {
	$var(pass) = "";
	if ($au == "alice") {
		$var(pass) = "alice-secret";
	}
	if ($au == "bob") {
		$var(pass) = "bob-secret";
	}
}

route[REGISTRAR] {
	route(PASSWD);
#!ifdef WITH_AUTH_BUG
	# MISCONFIGURATION: only checks that an Authorization header exists.
	if (!is_present_hf("Authorization")) {
		www_challenge("$td", "0");
		exit;
	}
	xlog("L_WARN", "BUGGY MODE: REGISTER for $tu accepted without verifying credentials\n");
#!else
	# Unknown users are refused; there is no password to check them against.
	if ($au != $null && $var(pass) == "") {
		sl_send_reply("403", "Unknown user");
		exit;
	}
	if ($au == $null || !pv_www_authenticate("$td", "$var(pass)", "0")) {
		www_challenge("$td", "0");
		exit;
	}
	# A user may only register their own address.
	if ($au != $tU) {
		sl_send_reply("403", "Forbidden auth ID");
		exit;
	}
#!endif
	consume_credentials();
	if (!save("location")) {
		sl_reply_error();
	}
	exit;
}

route[AUTH] {
	# This server only serves statefuzz.local, so a caller from another
	# domain cannot log in here and must not skip the password check.
	if (from_uri != myself) {
		sl_send_reply("403", "Not from this domain");
		exit;
	}
	route(PASSWD);
#!ifdef WITH_AUTH_BUG
	# MISCONFIGURATION: same mistake for calls.
	if (!is_present_hf("Proxy-Authorization")) {
		proxy_challenge("$fd", "0");
		exit;
	}
#!else
	if ($au != $null && $var(pass) == "") {
		sl_send_reply("403", "Unknown user");
		exit;
	}
	if ($au == $null || !pv_proxy_authenticate("$fd", "$var(pass)", "0")) {
		proxy_challenge("$fd", "0");
		exit;
	}
	# A user may only call as themselves.
	if ($au != $fU) {
		sl_send_reply("403", "Forbidden auth ID");
		exit;
	}
#!endif
	consume_credentials();
}
